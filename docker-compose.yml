version: "3.8"

services:
  # ============================================================================
  # PostgreSQL Database Service (Local mirror of Neon AWS PostgreSQL)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: trustvault-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trustvault_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # TrustVault Spring Boot Backend (Simulates Render Cloud Web Service)
  # ============================================================================
  trustvault-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustvault-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      # Connect to local docker postgres, or override with Neon connection string:
      # DB_URL: jdbc:postgresql://ep-gentle-sun-b5gv4iid-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
      DB_URL: jdbc:postgresql://postgres:5432/trustvault
      DB_USERNAME: postgres
      DB_PASSWORD: trustvault_secret_password
      APP_ADMIN_EMAIL: admin123@gmail.com
      APP_ADMIN_PASSWORD: admin@123
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    ports:
      - "8080:8080"

volumes:
  pgdata:
    driver: local
