<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tv-grad-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tv-grad-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="tv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M32 4 L54 12 C54 36 32 58 32 60 C32 58 10 36 10 12 L32 4 Z" 
        fill="url(#tv-grad-shield)" 
        stroke="url(#tv-grad-cyan)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Concentric Vault Rim -->
  <circle cx="32" cy="30" r="14" 
          stroke="url(#tv-grad-cyan)" 
          stroke-width="2" 
          stroke-dasharray="3.5 2" 
          opacity="0.9" />

  <!-- Inner Vault Chamber -->
  <polygon points="32,20 41,25.5 41,35.5 32,41 23,35.5 23,25.5" 
           fill="#0b1329" 
           stroke="url(#tv-grad-cyan)" 
           stroke-width="1.6" />

  <!-- Keyhole Core -->
  <circle cx="32" cy="28.5" r="3.2" fill="#38bdf8" />
  <polygon points="30.5,29.5 33.5,29.5 34.5,36 29.5,36" fill="#38bdf8" />

  <!-- Security Verification Node -->
  <circle cx="32" cy="51" r="2.2" fill="#38bdf8" />
</svg>
